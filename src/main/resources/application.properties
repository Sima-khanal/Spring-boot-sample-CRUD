spring.application.name=CRUDSpringBootDemo
server.port=8081

# Local file-based H2 database; data is retained between application restarts.
spring.datasource.url=jdbc:h2:file:./data/crud-demo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create/update tables as JPA entities are added.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
